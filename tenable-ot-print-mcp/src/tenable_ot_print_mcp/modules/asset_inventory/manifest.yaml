name: asset_inventory
title: Asset Inventory
description: >
  Lists OT assets from the configured Tenable OT / Enterprise Manager
  connection with vendor, model, firmware, criticality, and risk
  summary fields. Sample module proving the Phase 0 pipeline
  (GraphQL fetch -> Markdown -> HTML) end-to-end.
params:
  - name: limit
    type: integer
    required: false
    default: 100
    description: Maximum number of matching assets to include (clamped to 500).
  - name: criticality_at_least
    type: string
    required: false
    default: null
    description: "Optional minimum criticality filter: none|low|medium|high. Applied server-side."
  - name: subnet
    type: string
    required: false
    default: null
    description: "Optional IPv4/IPv6 CIDR (e.g. 10.253.10.128/25). Matches assets whose IP falls within this subnet. Applied server-side, mirrors EM-MCP's native subnet filter."
output_formats: [markdown, html]
