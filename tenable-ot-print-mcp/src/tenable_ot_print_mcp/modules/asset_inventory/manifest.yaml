name: asset_inventory
title: Asset Inventory
description: >
  Lists OT assets from a paired ICP behind the configured Tenable OT /
  Enterprise Manager connection. Every asset field this module knows
  how to project (identity, classification, network, lifecycle, risk,
  and the 10 custom-field slots) is available via the `columns` param;
  a default 9-column set (vendor, model, firmware, criticality, IPs,
  last seen, risk, unresolved events) is used when `columns` is
  omitted. Sample module proving the Phase 0 pipeline (GraphQL fetch
  -> Markdown -> HTML) end-to-end.
params:
  - name: limit
    type: integer
    required: false
    default: null
    description: >-
      Optional maximum number of matching assets to include. If omitted,
      every matching asset is fetched (paged through server-side, no
      artificial cap) -- a report should list everything that matches,
      not just a first page. Only bounded by an internal 50,000-asset
      safety circuit breaker meant to guard against a malformed
      paginated response, not to cap legitimate results.
  - name: criticality_at_least
    type: string
    required: false
    default: null
    description: "Optional minimum criticality filter: none|low|medium|high. Applied server-side."
  - name: subnet
    type: string
    required: false
    default: null
    description: "Optional IPv4/IPv6 CIDR (e.g. 10.253.10.128/25). Matches assets whose IP falls within this subnet. Applied server-side, mirrors EM-MCP's native subnet filter."
  - name: search
    type: string
    required: false
    default: null
    description: "Optional free-text search, passed through to Tenable's native GraphQL `search` argument on the assets field (e.g. can match a location/zone tag like 'PAINT SHOP'). Applied server-side, same mechanism EM-MCP uses."
  - name: site_uuid
    type: string
    required: false
    default: null
    description: "Target ICP's machine id (UUID). If omitted and exactly one ICP is paired to this EM, that ICP is used automatically; if more than one is paired, this or site_name becomes required."
  - name: site_name
    type: string
    required: false
    default: null
    description: "Target ICP by its paired name instead of site_uuid. Same auto-resolution rule applies."
  - name: columns
    type: array
    required: false
    default: null
    description: >-
      Optional list of column names to include, in the order they
      should appear (also accepts a comma-separated string). Omit to
      use the default 9-column report: name, vendor, model,
      firmware_version, criticality, ip, last_seen, total_risk,
      unresolved_events. Unknown names are rejected with the full list
      of valid ones. Available columns: asset_id, name, type,
      super_type, category, vendor, model, firmware_version, os,
      os_version, os_architecture, family, description, location,
      purdue_level, criticality, hidden, run_status, run_status_time,
      extended_run_status, lifecycle_status, first_seen, last_seen,
      last_update, serial, slot, backplane_name, backplane_size, ip,
      mac, segments, attack_vector, total_risk, plugin_count,
      unresolved_events, custom_field_1..custom_field_10.
output_formats: [markdown, html]
