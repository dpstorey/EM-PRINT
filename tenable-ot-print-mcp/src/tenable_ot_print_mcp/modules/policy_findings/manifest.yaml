name: policy_findings
title: Policy Findings
description: >
  Lists policy findings (per policy x asset hit) from a paired ICP behind
  the configured Tenable One OT Exposure / Enterprise Manager connection.
  This is Tenable's `policyFindings` GraphQL surface -- the real data
  behind the GUI's "Compliance"/"Policy Violations" pages, just under a
  different UI label; a separate GraphQL type from `vulnerability_findings`
  despite the similar English name. A default 9-column set (policy,
  severity, status, category, active hits, first/last hit, source/
  destination assets) is used when `columns` is omitted; call
  `list_available_columns` for the full set. Like vulnerability_findings,
  this module does not accept a `sort` param yet -- rows are always
  returned most-recently-hit first, a deliberate simplification while only
  one sortable field on this GraphQL surface has been confirmed against
  real, production usage.
params:
  - name: limit
    type: integer
    required: false
    default: null
    description: >-
      Optional maximum number of matching policy findings to include. If
      omitted, every matching finding is fetched (paged through
      server-side, no artificial cap). Only bounded by an internal
      50,000-finding safety circuit breaker meant to guard against a
      malformed paginated response, not to cap legitimate results.
  - name: severity_at_least
    type: string
    required: false
    default: null
    description: "Optional minimum policy severity filter: none|low|medium|high. Applied server-side. Note this is a different 4-value enum from vulnerability_findings' 5-value severity_at_least."
  - name: status
    type: string
    required: false
    default: null
    description: >-
      Optional status filter, passed through as-is (e.g. "Open",
      "Resolved") -- this surface does not have a fixed, closed status
      enum the way vulnerability_findings' `status` does, so no fixed
      value list is enforced here.
  - name: policy_id
    type: string
    required: false
    default: null
    description: "Optional exact-match filter on the policy's id."
  - name: plugin_id
    type: string
    required: false
    default: null
    description: "Optional exact-match filter on the plugin id associated with this finding."
  - name: mitre_technique
    type: string
    required: false
    default: null
    description: "Optional exact-match filter on an associated MITRE ATT&CK technique. Filter-only -- there is no corresponding display column since this field isn't part of the returned finding record."
  - name: search
    type: string
    required: false
    default: null
    description: "Optional free-text search, passed through to Tenable's native GraphQL `search` argument on the policyFindings field."
  - name: site_uuid
    type: string
    required: false
    default: null
    description: "Target ICP's machine id (UUID). If omitted and exactly one ICP is paired to this EM, that ICP is used automatically; if more than one is paired, this or site_name becomes required."
  - name: site_name
    type: string
    required: false
    default: null
    description: "Target ICP by its paired name instead of site_uuid. Same auto-resolution rule applies."
  - name: columns
    type: array
    required: false
    default: null
    description: >-
      Optional list of column names to include, in the order they should
      appear (also accepts a comma-separated string; case-insensitive;
      duplicates collapsed). Call `list_available_columns` for this
      module's full key/label list and its default set before guessing
      names -- an unknown name is rejected outright rather than silently
      dropped. Omitting `columns` uses the default 9-column set
      (policy_title, severity, status, category, active_hits, first_hit,
      last_hit, src_assets, dst_assets).
output_formats: [markdown, html]
