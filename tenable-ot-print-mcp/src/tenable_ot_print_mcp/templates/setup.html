<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tenable OT Print Report MCP - Setup</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 560px; margin: 3rem auto; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=text], input[type=password] { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
  .error { color: #a40000; margin-top: 1rem; }
  button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; }
  .checkbox-row { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Tenable OT Print Report MCP &mdash; first-run setup</h1>
<p>Enter the Enterprise Manager (or ICP) GraphQL endpoint this server will use to generate reports.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/setup">
  <label for="tenable_url">Tenable OT / EM URL</label>
  <input type="text" id="tenable_url" name="tenable_url" placeholder="https://em.example.com" value="{{ form.tenable_url or '' }}" required>

  <label for="tenable_api_key">API key</label>
  <input type="password" id="tenable_api_key" name="tenable_api_key" required>

  <div class="checkbox-row">
    <label><input type="checkbox" name="tls_verify" {% if form.tls_verify %}checked{% endif %}> Verify TLS certificate</label>
  </div>

  <button type="submit">Save &amp; verify connection</button>
</form>
</body>
</html>
